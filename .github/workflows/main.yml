name: Binaries

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      buildFlags:
        required: false
        type: string

jobs:
  Windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Prepare Windows Lime rebuild
        shell: pwsh
        run: |
          function Run {
            param([string]$exe, [string[]]$args)
            Write-Host ">>> $exe $($args -join ' ')"
            & $exe @args
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Command failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
            }
          }

          Run haxelib setup C:/haxelib
          Run haxelib install hxcpp --quiet
          Run haxelib install hxpkg --quiet
          Run haxelib run hxpkg install
          Run haxelib git lime https://github.com/ArkoseLabsOfficial/lime
          Run haxelib run lime rebuild cpp -release

      - name: Build Windows
        run: haxelib run lime build windows -release -D${{ inputs.buildFlags }}

      - uses: actions/upload-artifact@v4
        with:
          name: NightmareVision (Windows)
          path: export/release/windows/bin

  Linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-13 g++-13 \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            libpipewire-0.3-dev libgl1-mesa-dev libegl1-mesa-dev \
            libglu1-mesa-dev libdbus-1-dev libudev-dev \
            libxkbcommon-dev libx11-dev libxext-dev libx11-xcb-dev \
            libxfixes-dev libxss-dev libxrender-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxxf86vm-dev \
            libgbm-dev libdrm-dev libdecor-0-dev libvulkan-dev \
            pkg-config

      - name: Prepare Linux Lime rebuild
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp --quiet
          haxelib install hxpkg --quiet
          haxelib run hxpkg install
          haxelib git lime https://github.com/ArkoseLabsOfficial/lime
          haxelib run lime rebuild cpp -release

      - name: Build Linux
        env:
          CC: gcc-13
          CXX: g++-13
        run: haxelib run lime build linux -release -D${{ inputs.buildFlags }}

      - uses: actions/upload-artifact@v4
        with:
          name: NightmareVision (Linux)
          path: export/release/linux/bin

  MacIntel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install macOS deps
        run: brew install pkg-config

      - name: Prepare macOS Lime rebuild
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp --quiet
          haxelib install hxpkg --quiet
          haxelib run hxpkg install
          haxelib git lime https://github.com/ArkoseLabsOfficial/lime
          haxelib run lime rebuild cpp -release

      - name: Build macOS Intel
        run: haxelib run lime build mac -release -64 -D${{ inputs.buildFlags }}

      - uses: actions/upload-artifact@v4
        with:
          name: NightmareVision (macOS-Intel)
          path: export/release/macos/bin

  MacARM:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install macOS deps
        run: brew install pkg-config

      - name: Prepare macOS Lime rebuild
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp --quiet
          haxelib install hxpkg --quiet
          haxelib run hxpkg install
          haxelib git lime https://github.com/ArkoseLabsOfficial/lime
          haxelib run lime rebuild cpp -release

      - name: Build macOS ARM
        run: haxelib run lime build mac -release -arm64 -D${{ inputs.buildFlags }}

      - uses: actions/upload-artifact@v4
        with:
          name: NightmareVision (macOS-ARM)
          path: export/release/macos/bin

  Android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp --quiet
          haxelib install hxpkg --quiet
          haxelib run hxpkg install
          haxelib git lime https://github.com/ArkoseLabsOfficial/lime

      - uses: android-actions/setup-android@v3

      - name: Build Android
        run: haxelib run lime build android -release -Dlegacy -D${{ inputs.buildFlags }}

      - uses: actions/upload-artifact@v4
        with:
          name: NightmareVision (Android)
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk

  iOS:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp --quiet
          haxelib install hxpkg --quiet
          haxelib run hxpkg install
          haxelib git lime https://github.com/ArkoseLabsOfficial/lime

      - name: Build iOS
        run: haxelib run lime build ios -nosign -release -D${{ inputs.buildFlags }}

      - uses: actions/upload-artifact@v4
        with:
          name: NightmareVision (iOS)
          path: export/release/ios/build
